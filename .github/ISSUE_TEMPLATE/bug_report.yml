name: Bug report
description: Report incorrect migration planning, execution, state, or rollback behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MoonMigrate. Use synthetic files and remove private paths, configuration values, backups, and journal content.
  - type: input
    id: version
    attributes:
      label: MoonMigrate commit or version
      placeholder: e.g. 0.3.0 or a commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, MoonBit version, and interface used
      placeholder: Windows 11, MoonBit 0.x, native CLI
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Manifest validation and version routing
        - Filesystem preflight
        - Apply and journal
        - Status and rollback
        - CLI or JSON output
        - Build and documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Describe the synthetic directory, sanitized manifest, command, and steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed private files, configuration values, access tokens, personal paths, and real `.moonmigrate` state.
          required: true
