name: Feature request
description: Propose a practical MoonMigrate workflow or improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the application-data upgrade or recovery task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Example workflow
      description: Show a small before-and-after directory or command example.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Preferred interface
      options:
        - Manifest and version planning
        - Native execution and recovery
        - Native CLI
        - Library API
        - Documentation or examples
    validations:
      required: true
  - type: checkboxes
    id: guarantees
    attributes:
      label: Safety guarantees
      description: Select guarantees relevant to the proposal.
      options:
        - label: Preview before execution
        - label: Never overwrite an existing target
        - label: Journal and rollback support
        - label: Deterministic output
