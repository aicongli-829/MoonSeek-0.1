name: Check FileNest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install official MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moon.sh
          bash /tmp/install-moon.sh
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check JavaScript target and core tests
        run: |
          moon fmt --check
          moon check --target js
          moon test --target js
          moon build webui --target js --release
      - name: Check Native target and tests
        run: |
          moon check --target native
          moon test --target native
          moon build cmd/filenest --target native --release
      - name: Verify source-size target
        run: |
          lines=$(git ls-files '*.mbt' | xargs cat | wc -l)
          echo "Tracked MoonBit lines: $lines"
          test "$lines" -ge 4000
